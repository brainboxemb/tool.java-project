name: Reusable Java verify

on:
  workflow_call:
    inputs:
      working-directory:
        description: Java project directory containing pom.xml and Maven Wrapper
        required: false
        type: string
        default: .
      java-version:
        description: Exact Temurin Java version used by hosted CI
        required: false
        type: string
        default: '8.0.504+1'
      maven-version:
        description: Maven version expected from the repository Maven Wrapper
        required: false
        type: string
        default: '3.9.16'
      maven-wrapper-version:
        description: Maven Wrapper version expected in maven-wrapper.properties
        required: false
        type: string
        default: '3.3.4'
      artifact-name:
        description: Name for the canonical Linux artifact upload
        required: false
        type: string
        default: java-canonical-artifact
      artifact-path:
        description: Path relative to working-directory for canonical artifact upload
        required: true
        type: string
      runnable-jar-name:
        description: Optional JAR filename to execute from the canonical artifact on Windows
        required: false
        type: string
        default: ''
      smoke-expected-output:
        description: Optional exact stdout expected from the Windows canonical-artifact smoke run
        required: false
        type: string
        default: ''
      test-report-path:
        description: Glob relative to working-directory for Maven test reports
        required: false
        type: string
        default: '**/target/surefire-reports/**'
      publication-artifact-paths:
        description: Optional newline-separated canonical build files to stage for generated branch publication
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  linux-canonical:
    name: Linux canonical build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up exact Java 8 baseline
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          check-latest: false
          verify-signature: true
          cache: maven
          cache-dependency-path: ${{ inputs.working-directory }}/pom.xml

      - name: Checkout exact tool.java-project implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: brainboxemb/tool.java-project
          ref: ${{ github.workflow_sha }}
          path: .tooling/tool.java-project

      - name: Run canonical Java action
        shell: bash
        env:
          PUBLICATION_ARTIFACT_PATHS: ${{ inputs.publication-artifact-paths }}
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          args=(
            canonical
            --working-directory '${{ inputs.working-directory }}'
            --java-version '${{ inputs.java-version }}'
            --maven-version '${{ inputs.maven-version }}'
            --maven-wrapper-version '${{ inputs.maven-wrapper-version }}'
            --test-report-path '${{ inputs.test-report-path }}'
            --source-revision "$SOURCE_REVISION"
            --repository "$GITHUB_REPOSITORY"
          )

          if [[ -n "$PUBLICATION_ARTIFACT_PATHS" ]]; then
            args+=(--publication-root target/java-build-publication)
            while IFS= read -r configured_path || [[ -n "$configured_path" ]]; do
              configured_path="$(printf '%s' "$configured_path" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              [[ -n "$configured_path" ]] || continue
              args+=(--publication-artifact "$configured_path")
            done <<< "$PUBLICATION_ARTIFACT_PATHS"
          fi

          bash .tooling/tool.java-project/java-project.sh "${args[@]}"

      - name: Upload canonical Java artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload prepared build publication
        if: ${{ inputs.publication-artifact-paths != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}-publication
          path: ${{ inputs.working-directory }}/target/java-build-publication
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}-linux-evidence
          path: |
            ${{ inputs.working-directory }}/target/toolchain-build-provenance.txt
            ${{ inputs.working-directory }}/target/java-canonical-execution.log
            ${{ inputs.working-directory }}/${{ inputs.test-report-path }}
          if-no-files-found: warn
          retention-days: 14

  windows-compatibility:
    name: Windows compatibility build
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up exact Java 8 baseline
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          check-latest: false
          verify-signature: true
          cache: maven
          cache-dependency-path: ${{ inputs.working-directory }}/pom.xml

      - name: Validate Maven Wrapper baseline
        working-directory: ${{ inputs.working-directory }}
        shell: pwsh
        run: |
          if (-not (Test-Path .\mvnw.cmd)) { throw 'mvnw.cmd is missing' }
          if (-not (Test-Path .\.mvn\wrapper\maven-wrapper.properties)) { throw 'maven-wrapper.properties is missing' }
          $wrapper = Get-Content -Raw .\.mvn\wrapper\maven-wrapper.properties | ConvertFrom-StringData
          if ($wrapper.wrapperVersion -ne '${{ inputs.maven-wrapper-version }}') {
            throw "Unexpected Maven Wrapper version: $($wrapper.wrapperVersion)"
          }
          $version = (& .\mvnw.cmd --version | Out-String)
          Write-Host $version
          if ($version -notmatch 'Apache Maven ${{ inputs.maven-version }}') {
            throw 'Unexpected Maven version'
          }

      - name: Verify
        working-directory: ${{ inputs.working-directory }}
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress verify

      - name: Upload Windows test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}-windows-evidence
          path: ${{ inputs.working-directory }}/${{ inputs.test-report-path }}
          if-no-files-found: warn
          retention-days: 14

  windows-canonical-artifact-smoke:
    name: Windows canonical-artifact smoke
    if: ${{ inputs.runnable-jar-name != '' }}
    needs: linux-canonical
    runs-on: windows-2025
    timeout-minutes: 5

    steps:
      - name: Set up exact Java 8 baseline
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          check-latest: false
          verify-signature: true

      - name: Download canonical Linux artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ inputs.artifact-name }}
          path: canonical-artifact

      - name: Run canonical artifact on Windows
        shell: pwsh
        env:
          SMOKE_EXPECTED_OUTPUT: ${{ inputs.smoke-expected-output }}
        run: |
          $jar = Join-Path 'canonical-artifact' '${{ inputs.runnable-jar-name }}'
          if (-not (Test-Path $jar)) {
            Write-Host 'Downloaded artifact contents:'
            Get-ChildItem -Recurse canonical-artifact
            throw "Runnable JAR not found: $jar"
          }
          $output = (& java -jar $jar | Out-String).Trim()
          Write-Host $output
          if ($env:SMOKE_EXPECTED_OUTPUT -and $output -ne $env:SMOKE_EXPECTED_OUTPUT) {
            throw "Unexpected smoke output: $output"
          }
