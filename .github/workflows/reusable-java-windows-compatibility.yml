name: Reusable Java Windows compatibility

on:
  workflow_call:
    inputs:
      source-revision:
        description: Optional exact source commit for full Windows qualification; event source is used when omitted
        required: false
        type: string
        default: ''
      working-directory:
        description: Java project directory containing pom.xml and Maven Wrapper
        required: false
        type: string
        default: .
      java-version:
        description: Exact Temurin Java version used by hosted CI
        required: false
        type: string
        default: '8.0.504+1'
      maven-version:
        description: Maven version expected from the repository Maven Wrapper
        required: false
        type: string
        default: '3.9.16'
      maven-wrapper-version:
        description: Maven Wrapper version expected in maven-wrapper.properties
        required: false
        type: string
        default: '3.3.4'
      artifact-name:
        description: Existing Linux canonical artifact to smoke-test on Windows
        required: true
        type: string
      runnable-jar-name:
        description: Optional JAR filename to execute from the canonical artifact on Windows
        required: false
        type: string
        default: ''
      smoke-expected-output:
        description: Optional exact stdout expected from the Windows canonical-artifact smoke run
        required: false
        type: string
        default: ''
      test-report-path:
        description: Glob relative to working-directory for Maven test reports
        required: false
        type: string
        default: '**/target/surefire-reports/**'
      windows-mode:
        description: 'Windows qualification mode: none, smoke or full'
        required: false
        type: string
        default: full

permissions:
  contents: read

jobs:
  windows-compatibility:
    name: Windows compatibility build
    if: ${{ inputs.windows-mode == 'full' }}
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Validate exact source when supplied
        shell: pwsh
        env:
          SOURCE_REVISION: ${{ inputs.source-revision }}
        run: |
          if ($env:SOURCE_REVISION -and $env:SOURCE_REVISION -notmatch '^[0-9a-f]{40}$') {
            throw 'source-revision must be an exact 40-character commit SHA when supplied'
          }

      - name: Checkout exact consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-revision || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up exact Java 8 baseline
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          check-latest: false
          verify-signature: true
          cache: maven
          cache-dependency-path: |
            ${{ inputs.working-directory }}/**/pom.xml
            ${{ inputs.working-directory }}/.mvn/wrapper/maven-wrapper.properties
            ${{ inputs.working-directory }}/.mvn/extensions.xml

      - name: Validate Maven Wrapper baseline
        working-directory: ${{ inputs.working-directory }}
        shell: pwsh
        run: |
          if (-not (Test-Path .\mvnw.cmd)) { throw 'mvnw.cmd is missing' }
          if (-not (Test-Path .\.mvn\wrapper\maven-wrapper.properties)) { throw 'maven-wrapper.properties is missing' }
          $wrapper = Get-Content -Raw .\.mvn\wrapper\maven-wrapper.properties | ConvertFrom-StringData
          if ($wrapper.wrapperVersion -ne '${{ inputs.maven-wrapper-version }}') {
            throw "Unexpected Maven Wrapper version: $($wrapper.wrapperVersion)"
          }
          $version = (& .\mvnw.cmd --version | Out-String)
          Write-Host $version
          if ($version -notmatch 'Apache Maven ${{ inputs.maven-version }}') {
            throw 'Unexpected Maven version'
          }

      - name: Verify
        working-directory: ${{ inputs.working-directory }}
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress verify

      - name: Upload Windows test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}-windows-evidence
          path: ${{ inputs.working-directory }}/${{ inputs.test-report-path }}
          if-no-files-found: warn
          retention-days: 14

  windows-canonical-artifact-smoke:
    name: Windows canonical-artifact smoke
    if: ${{ (inputs.windows-mode == 'smoke' || inputs.windows-mode == 'full') && inputs.runnable-jar-name != '' }}
    runs-on: windows-2025
    timeout-minutes: 5

    steps:
      - name: Set up exact Java 8 baseline
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          check-latest: false
          verify-signature: true

      - name: Download canonical Linux artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ inputs.artifact-name }}
          path: canonical-artifact

      - name: Run canonical artifact on Windows
        shell: pwsh
        env:
          SMOKE_EXPECTED_OUTPUT: ${{ inputs.smoke-expected-output }}
        run: |
          $jar = Join-Path 'canonical-artifact' '${{ inputs.runnable-jar-name }}'
          if (-not (Test-Path $jar)) {
            Write-Host 'Downloaded artifact contents:'
            Get-ChildItem -Recurse canonical-artifact
            throw "Runnable JAR not found: $jar"
          }
          $output = (& java -jar $jar | Out-String).Trim()
          Write-Host $output
          if ($env:SMOKE_EXPECTED_OUTPUT -and $output -ne $env:SMOKE_EXPECTED_OUTPUT) {
            throw "Unexpected smoke output: $output"
          }
