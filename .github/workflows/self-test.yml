name: Self-test Java toolchain

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_TOOL_RELEASE_SHA: 7c43f37e7b07cfb57638a1d1dad2501de09ba7eb

jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate tool version and release tag semantics
        shell: bash
        run: |
          set -euo pipefail
          TOOL_VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ ! "${TOOL_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]]; then
            echo "ERROR: VERSION must contain X.Y.Z or X.Y.Z-SNAPSHOT" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if [[ "${TOOL_VERSION}" == *-SNAPSHOT ]]; then
              echo "ERROR: a release tag may not point to a SNAPSHOT tool version" >&2
              exit 1
            fi
            EXPECTED_TAG="v${TOOL_VERSION}"
            if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
              echo "ERROR: tag ${GITHUB_REF_NAME} does not match VERSION ${TOOL_VERSION}" >&2
              exit 1
            fi
            grep -F "## ${TOOL_VERSION} —" CHANGELOG.md
          fi

          echo "tool.java-project version=${TOOL_VERSION} ref=${GITHUB_REF}"
      - name: Validate generic Git lifecycle release pin
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'brainboxemb/tool.git-project/.github/workflows/reusable-release.yml@v0.2.8' .github/workflows/release.yml
          grep -F 'brainboxemb/tool.git-project/.github/workflows/reusable-pr-preview-cleanup.yml@v0.2.8' .github/workflows/pr-cleanup.yml
          grep -F 'brainboxemb/tool.git-project/.github/workflows/reusable-generated-output-publish.yml@v0.2.8' .github/workflows/reusable-java-publish.yml
          test "$(git ls-tree HEAD tools/tool.git-project | awk '{print $3}')" = "${GIT_TOOL_RELEASE_SHA}"

  bootstrap-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Bootstrap pinned Git tooling
        shell: bash
        run: |
          set -euo pipefail
          ./bootstrap.sh
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "${GIT_TOOL_RELEASE_SHA}"
          tools/tool.git-project/git-project.sh validate --repo .
          ./update-repo.sh

  bootstrap-windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout without submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Bootstrap pinned Git tooling
        shell: pwsh
        run: |
          .\bootstrap.ps1
          $actual = (git -C tools/tool.git-project rev-parse HEAD).Trim()
          if ($actual -ne $env:GIT_TOOL_RELEASE_SHA) { throw "Unexpected tool.git-project SHA: $actual" }
          .\tools\tool.git-project\git-project.ps1 validate -RepoRoot .
          .\update-repo.ps1

  fixture:
    needs: [release-metadata, bootstrap-linux, bootstrap-windows]
    uses: ./.github/workflows/reusable-java-verify.yml
    with:
      working-directory: fixture/minimal-java-app
      java-version: '8.0.504+1'
      maven-version: '3.9.16'
      maven-wrapper-version: '3.3.4'
      artifact-name: minimal-java-app-canonical
      artifact-path: target/minimal-java-app-0.1.0-SNAPSHOT.jar
      runnable-jar-name: minimal-java-app-0.1.0-SNAPSHOT.jar
      smoke-expected-output: 'tool.java-project fixture OK'
      test-report-path: target/surefire-reports/**
      publication-artifact-paths: target/minimal-java-app-0.1.0-SNAPSHOT.jar

  verify-test-summary:
    needs: fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source and released generic schema owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Bootstrap pinned Git tooling
        shell: bash
        run: |
          set -euo pipefail
          ./bootstrap.sh
          test "$(git -C tools/tool.git-project rev-parse HEAD)" = "${GIT_TOOL_RELEASE_SHA}"
          test -f tools/tool.git-project/schemas/execution-evidence.schema.json
      - name: Install schema-validation test dependency
        shell: bash
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
      - name: Download prepared publication
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: minimal-java-app-canonical-publication
          path: publication
      - name: Verify readable Surefire summary and common execution evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f publication/evidence/tests/README.md
          grep -F '# Unit test report' publication/evidence/tests/README.md
          grep -F '**Status: PASS**' publication/evidence/tests/README.md
          grep -F '| 1 | 0 | 0 | 0 |' publication/evidence/tests/README.md
          grep -F 'com.brainboxemb.tool.fixture.AppTest' publication/evidence/tests/README.md
          grep -F '[Readable Surefire summary](evidence/tests/README.md)' publication/README.md
          test ! -e publication/evidence/execution.log
          test -s publication/evidence/executions/java-canonical/execution.log
          test -s publication/evidence/executions/java-canonical/execution.json
          grep -F '## Producer execution evidence' publication/README.md
          grep -F '## Domain evidence' publication/README.md
          grep -F '## Orchestration/materialization evidence' publication/README.md
          grep -F '## Publication context' publication/README.md
          grep -F 'producer source revision above may intentionally differ from the current materialization source revision' publication/README.md

          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path.cwd()
          schema = json.loads(
              (root / 'tools/tool.git-project/schemas/execution-evidence.schema.json').read_text(encoding='utf-8')
          )
          Draft202012Validator.check_schema(schema)
          execution_path = root / 'publication/evidence/executions/java-canonical/execution.json'
          execution = json.loads(execution_path.read_text(encoding='utf-8'))

          expected = {
              'capability': 'java.canonical',
              'owner': 'brainboxemb/tool.java-project',
              'action': 'canonical',
              'status': 'success',
              'exit_code': 0,
              'log': 'execution.log',
          }
          for key, value in expected.items():
              if execution.get(key) != value:
                  raise SystemExit(f'{key} mismatch: {execution.get(key)!r}')

          producer_log = (execution_path.parent / execution['log']).resolve()
          if not producer_log.is_file():
              raise SystemExit(f'execution log target missing: {execution["log"]}')

          source_sha = (root / 'publication/source-sha.txt').read_text(encoding='utf-8').strip()
          if execution['source_revision'] != source_sha:
              raise SystemExit('execution source_revision does not match source-sha.txt')

          provenance = {}
          for line in (root / 'publication/evidence/toolchain-build-provenance.txt').read_text(encoding='utf-8').splitlines():
              if '=' in line:
                  key, value = line.split('=', 1)
                  provenance[key] = value
          if execution['owner_revision'] != provenance.get('tool_java_project_revision'):
              raise SystemExit('execution owner_revision does not match Java owner provenance')
          if execution.get('tool_java_project_version') != provenance.get('tool_java_project_version'):
              raise SystemExit('execution tool version does not match Java owner provenance')

          for relative in execution['domain_evidence']:
              target = (execution_path.parent / relative).resolve()
              if not target.is_file():
                  raise SystemExit(f'domain evidence target missing: {relative}')
          PY

  publish-fixture:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    needs: [fixture, verify-test-summary]
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-java-publish.yml
    with:
      publication-artifact-name: minimal-java-app-canonical-publication

  publish-tool-release:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    needs: [fixture, verify-test-summary, publish-fixture]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout verified release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Prepare release notes and provenance
        shell: bash
        run: |
          set -euo pipefail
          TOOL_VERSION="$(tr -d '\r\n' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${TOOL_VERSION}"

          awk -v version="${TOOL_VERSION}" '
            $0 ~ "^## " version " —" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

          GIT_TOOL_SHA="$(git ls-tree HEAD tools/tool.git-project | awk '{print $3}')"
          cat > tool.java-project-release.txt <<EOF
          tool.java-project version: ${TOOL_VERSION}
          release tag: ${GITHUB_REF_NAME}
          source SHA: ${GITHUB_SHA}
          tool.git-project gitlink: ${GIT_TOOL_SHA}
          Java CI baseline: Eclipse Temurin 8.0.504+1
          Maven baseline: 3.9.16
          Maven Wrapper baseline: 3.3.4
          EOF
      - name: Create GitHub Release
        # This remains Java-owned because the Release carries Java/JDK/Maven
        # provenance that the generic repository lifecycle must not invent.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" tool.java-project-release.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" tool.java-project-release.txt \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
