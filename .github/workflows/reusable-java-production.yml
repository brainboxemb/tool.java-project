name: Reusable Java production

on:
  workflow_call:
    inputs:
      working-directory:
        description: Java project directory containing pom.xml and Maven Wrapper
        required: false
        type: string
        default: .
      affected-task:
        description: Fully-qualified Moon task for the canonical Java capability
        required: false
        type: string
        default: consumer:java.canonical
      windows-full-task:
        description: Fully-qualified Moon task whose impact requires full Windows Maven qualification
        required: false
        type: string
        default: consumer:java.windows-full
      windows-mode:
        description: Windows qualification override: auto, none, smoke or full
        required: false
        type: string
        default: auto
      windows-default-mode:
        description: Windows qualification used by auto for normal affected Java changes: none, smoke or full
        required: false
        type: string
        default: smoke
      base-revision:
        description: Exact comparison base commit for affected analysis
        required: true
        type: string
      head-revision:
        description: Exact source commit to qualify
        required: true
        type: string
      java-version:
        required: false
        type: string
        default: '8.0.504+1'
      maven-version:
        required: false
        type: string
        default: '3.9.16'
      maven-wrapper-version:
        required: false
        type: string
        default: '3.3.4'
      artifact-name:
        required: false
        type: string
        default: java-canonical-artifact
      artifact-path:
        required: true
        type: string
      runnable-jar-name:
        required: false
        type: string
        default: ''
      smoke-expected-output:
        required: false
        type: string
        default: ''
      test-report-path:
        required: false
        type: string
        default: '**/target/surefire-reports/**'
      publication-artifact-paths:
        required: false
        type: string
        default: ''
    outputs:
      affected:
        description: Whether canonical Java execution is required
        value: ${{ jobs.preflight.outputs.affected }}
      windows-mode:
        description: Resolved Windows qualification mode
        value: ${{ jobs.preflight.outputs.windows_mode }}

permissions:
  contents: read

jobs:
  preflight:
    name: Java affected preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.resolve.outputs.affected }}
      windows_mode: ${{ steps.resolve.outputs.windows_mode }}
    steps:
      - name: Validate policy inputs
        shell: bash
        env:
          WINDOWS_MODE: ${{ inputs.windows-mode }}
          WINDOWS_DEFAULT_MODE: ${{ inputs.windows-default-mode }}
        run: |
          set -euo pipefail
          case "$WINDOWS_MODE" in
            auto|none|smoke|full) ;;
            *) echo "ERROR: windows-mode must be auto, none, smoke or full" >&2; exit 2 ;;
          esac
          case "$WINDOWS_DEFAULT_MODE" in
            none|smoke|full) ;;
            *) echo "ERROR: windows-default-mode must be none, smoke or full" >&2; exit 2 ;;
          esac

      - name: Checkout exact consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.head-revision }}
          fetch-depth: 1
          filter: blob:none

      - name: Fetch exact affected-analysis base
        shell: bash
        env:
          BASE_REVISION: ${{ inputs.base-revision }}
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none --depth=1 origin "$BASE_REVISION"
          git rev-parse --verify "${BASE_REVISION}^{commit}" >/dev/null

      - name: Bootstrap pinned generic repository tooling
        shell: bash
        run: |
          set -euo pipefail
          ./bootstrap.sh
          test -x tools/tool.git-project/moon-affected.sh

      - name: Resolve Java and Windows impact
        id: resolve
        shell: bash
        env:
          BASE_REVISION: ${{ inputs.base-revision }}
          HEAD_REVISION: ${{ inputs.head-revision }}
          JAVA_TASK: ${{ inputs.affected-task }}
          WINDOWS_FULL_TASK: ${{ inputs.windows-full-task }}
          REQUESTED_WINDOWS_MODE: ${{ inputs.windows-mode }}
          WINDOWS_DEFAULT_MODE: ${{ inputs.windows-default-mode }}
        run: |
          set -euo pipefail
          mkdir -p .moon/preflight/java .moon/preflight/windows-full

          java_affected="$(bash tools/tool.git-project/moon-affected.sh "$JAVA_TASK" \
            --base "$BASE_REVISION" --head "$HEAD_REVISION" \
            --evidence-dir .moon/preflight/java)"

          if [[ "$java_affected" == true ]]; then
            windows_full_affected="$(bash tools/tool.git-project/moon-affected.sh "$WINDOWS_FULL_TASK" \
              --base "$BASE_REVISION" --head "$HEAD_REVISION" \
              --evidence-dir .moon/preflight/windows-full)"
          else
            windows_full_affected=false
          fi

          resolved=none
          if [[ "$java_affected" == true ]]; then
            case "$REQUESTED_WINDOWS_MODE" in
              auto)
                if [[ "$windows_full_affected" == true ]]; then
                  resolved=full
                else
                  resolved="$WINDOWS_DEFAULT_MODE"
                fi
                ;;
              none|smoke|full) resolved="$REQUESTED_WINDOWS_MODE" ;;
            esac
          fi

          printf 'affected=%s\n' "$java_affected" >> "$GITHUB_OUTPUT"
          printf 'windows_mode=%s\n' "$resolved" >> "$GITHUB_OUTPUT"
          printf 'java_affected=%s windows_full_affected=%s windows_default_mode=%s windows_mode=%s\n' \
            "$java_affected" "$windows_full_affected" "$WINDOWS_DEFAULT_MODE" "$resolved"

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name }}-preflight
          path: .moon/preflight
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Java execution
    if: ${{ needs.preflight.outputs.affected == 'true' }}
    needs: preflight
    uses: ./.github/workflows/reusable-java-verify.yml
    with:
      working-directory: ${{ inputs.working-directory }}
      java-version: ${{ inputs.java-version }}
      maven-version: ${{ inputs.maven-version }}
      maven-wrapper-version: ${{ inputs.maven-wrapper-version }}
      artifact-name: ${{ inputs.artifact-name }}
      artifact-path: ${{ inputs.artifact-path }}
      runnable-jar-name: ${{ inputs.runnable-jar-name }}
      smoke-expected-output: ${{ inputs.smoke-expected-output }}
      test-report-path: ${{ inputs.test-report-path }}
      publication-artifact-paths: ${{ inputs.publication-artifact-paths }}
      windows-mode: ${{ needs.preflight.outputs.windows_mode }}
