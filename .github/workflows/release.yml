name: Release tool.java-project

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Immutable release tag, e.g. v0.1.2'
        required: true
        type: string
      release_sha:
        description: 'Exact already-verified main commit SHA to tag'
        required: true
        type: string
  push:
    branches:
      - 'release-request/**'

permissions:
  contents: write
  actions: write

jobs:
  release:
    # Generic request validation, main-run gates, tag creation and request-branch
    # cleanup belong to tool.git-project. Java-specific provenance and GitHub
    # Release assets remain in the tagged self-test below this boundary.
    uses: brainboxemb/tool.git-project/.github/workflows/reusable-release.yml@v0.1.3
    with:
      version: ${{ inputs.version || '' }}
      release_sha: ${{ inputs.release_sha || '' }}
      required_main_workflows: |
        self-test.yml
        local-action-test.yml
      tagged_verification_workflow: self-test.yml
      wait_for_tagged_verification: true
