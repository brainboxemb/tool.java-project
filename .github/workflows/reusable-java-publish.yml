name: Reusable Java build publication

on:
  workflow_call:
    inputs:
      publication-artifact-name:
        description: Actions artifact containing the prepared generated build-output tree
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    permissions:
      contents: write
    uses: brainboxemb/tool.git-project/.github/workflows/reusable-generated-output-publish.yml@v0.1.1
    with:
      artifact_name: ${{ inputs.publication-artifact-name }}
      branch_suffix: bld
